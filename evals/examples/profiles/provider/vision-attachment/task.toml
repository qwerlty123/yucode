schema_version = 2
id = "provider-vision-attachment"
prompt = "prompt.md"
targets = ["agent.vision"]
profile = "vision_attachment"
category = "vision"
allowed_tools = ["Edit"]
step_budget = 3
expected_artifact = "vision-attachment.txt"
attachments = ["sample.png.b64"]
scenario = "scenario.json"
protocol_checks = ["real-user-input-attachment"]

[source]
type = "local"
path = "source"

[environment]
image = "python:3.12"
network = "provider-only"

[grader]
path = "grader"
command = ["python3", "{grader}/grade.py"]

[success]
require = ["within_budget", "verifier_passed", "expected_artifact_exists", "normal_success_stop"]
