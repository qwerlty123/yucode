schema_version = 2
id = "ndjson-stream"
prompt = "prompt.md"
targets = ["agent.coding.patch"]
profile = "coding_benchmark"
category = "coding"
tags = ["javascript", "local-agent", "deterministic-grader"]
allowed_tools = ["Read", "Search", "Edit", "Bash", "Ask", "Note"]
step_budget = 16
expected_artifact = "ndjson.mjs"
scenario = "scenario.json"
protocol_checks = ["edit-required"]
safety_checks = ["path_within_workspace", "network_attempt"]

[metadata]
language = "javascript"
yolo = true

[source]
type = "local"
path = "source"

[environment]
image = "node:22.17.0-bookworm-slim@sha256:b04ce4ae4e95b522112c2e5c52f781471a5cbc3b594527bcddedee9bc48c03a0"
expected_digest = "sha256:b04ce4ae4e95b522112c2e5c52f781471a5cbc3b594527bcddedee9bc48c03a0"
platform = "linux/amd64"
network = "provider-only"

[grader]
path = "grader"
command = ["node", "{grader}/grade.mjs"]
result_file = "grade.json"
gold_patch = "gold.patch"
base_must_fail = true

[limits]
max_agent_steps = 16
max_model_calls = 10
max_tool_errors = 2
max_total_tokens = 60000
agent_timeout_seconds = 600
grader_timeout_seconds = 60
memory = "1g"
cpus = 2.0
pids = 128

[success]
require = ["within_budget", "verifier_passed", "expected_artifact_exists", "normal_success_stop"]
